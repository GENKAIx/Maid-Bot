<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>Горничная</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <nav>
      <h1>🧹 Горничная</h1>
      <a data-tab="today" class="on">Сегодня</a>
      <a data-tab="plans">Планы</a>
      <a data-tab="tasks">Задачи</a>
      <a data-tab="dates">Важные даты</a>
      <div class="spacer"></div>
      <a data-tab="settings">Настройки</a>
    </nav>
    <main>
      <div class="content" id="content"></div>
      <div id="toast"></div>
      <form class="composer" id="composer">
        <div class="rec-bar" aria-live="polite">
          <button type="button" class="rec-trash" title="Удалить запись (Esc)" aria-label="Удалить запись"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
          <span class="rec-dot"></span><span class="rec-time">0:00</span>
          <canvas class="rec-wave"></canvas>
        </div>
        <textarea id="input" placeholder="Что было, что запланировать, что не забыть… (Enter — отправить, Shift+Enter — новая строка)"></textarea>
        <button type="button" id="mic" class="mic" title="Сказать голосом" aria-label="Сказать голосом"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button class="primary" type="submit">Записать</button>
      </form>
    </main>
  </div>
  <script src="common.js"></script>
  <script src="voice.js"></script>
  <script src="app.js"></script>
</body>
</html>
