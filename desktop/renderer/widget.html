<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; media-src 'self'; img-src 'self' data: blob:" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="widget">
  <div class="stage" id="stage">
    <!-- Горничная стоит за правым краем панели (низ фигурки закрыт её верхом), облачко с ответами — слева от неё. -->
    <div class="perch" id="perch">
      <div class="courses hidden" id="courses"></div>
      <div class="bubble hidden" id="bubble">
        <div class="bubble-text" id="bubbleText"></div>
        <div class="bubble-cards" id="bubbleCards"></div>
        <div class="bubble-actions" id="bubbleActions"></div>
      </div>
      <!-- Непрочитанные напоминания (inbox.js) — значки летают слева от горничной. -->
      <div class="inbox hidden" id="inbox" aria-label="Непрочитанные напоминания"></div>
      <div class="maid" id="maid">
        <img class="face" id="face" src="../assets/maid/idle.webp" alt="" draggable="false" />
      </div>
    </div>

    <!-- Часы планов (clock.js): выезжают слева от панели, когда планы меняются или их смотрят. -->
    <div class="plan-clock hidden" id="planClock" title="Планы дня · щелчок — спрятать"></div>

    <!-- Свёрнутая панель: часы, дата и сколько задач; горничная выглядывает из-за её верха. -->
    <div class="mini" id="mini" title="Двойной щелчок — развернуть">
      <div class="mini-top"><span class="mini-clock" id="miniClock">--:--</span><span class="mini-day" id="miniDay"></span>
        <button type="button" class="mini-open" id="miniOpen" title="Развернуть панель" aria-label="Развернуть панель">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button></div>
      <div class="mini-tasks" id="miniTasks"></div>
    </div>

    <div class="w" id="w">
      <div class="head" id="head" title="Тащите, чтобы передвинуть">
        <span class="clock" id="clock">--:--</span>
        <span class="muted small" id="day"></span>
        <button class="gear" id="gear" title="Открыть полную версию · правый щелчок — настройки виджета" aria-label="Открыть полную версию">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-8 8M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>
        </button>
      </div>
      <div class="pins" id="pins"></div>
      <div class="next" id="next"></div>
      <div class="scroll" id="body"></div>
      <!-- Уголок справа внизу: тянуть вниз — панель длиннее, двойной щелчок — обычная высота. -->
      <div class="grip" id="grip" title="Тяните, чтобы сделать панель длиннее · двойной щелчок — обычная высота"></div>
      <div class="prefs hidden" id="prefs"></div>
      <div class="bar"><button id="open">Окно</button><button id="release">Отпустить</button></div>
      <form class="chat" id="chat" autocomplete="off">
        <div class="hist hidden" id="chatHist" aria-label="Последние ответы"></div>
        <div class="outbox hidden" id="chatQueue" aria-live="polite"></div>
        <div class="pics hidden" id="chatPics" title="Картинки уйдут вместе с сообщением"></div>
        <div class="rec-bar" aria-live="polite">
          <button type="button" class="rec-trash" title="Удалить запись (Esc)" aria-label="Удалить запись"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
          <span class="rec-dot"></span><span class="rec-time">0:00</span>
          <canvas class="rec-wave"></canvas>
        </div>
        <div class="field">
          <button type="button" id="chatClip" class="plus" title="Приложить картинку: чек, билет, скриншот (или Ctrl+V, или перетащить)" aria-label="Приложить картинку"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          <textarea id="chatInput" rows="1" placeholder="Скажи горничной…" maxlength="4000" title="Enter — отправить, Shift+Enter — новая строка"></textarea>
          <button type="button" id="chatHistBtn" class="plus hist-btn" title="Последние ответы горничной" aria-label="Последние ответы"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
        </div>
        <input type="file" id="chatFile" accept="image/*" multiple hidden />
        <!-- Одна кнопка справа, как в Telegram: пусто — микрофон, есть текст/картинки или идёт запись — «отправить». -->
        <span class="act">
          <button type="button" id="chatMic" class="mic" title="Голосовое сообщение" aria-label="Голосовое сообщение"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          <button type="submit" id="chatSend" title="Отправить (Enter)" aria-label="Отправить"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></button>
        </span>
      </form>
    </div>
  </div>
  <script src="common.js"></script>
  <script src="voice.js"></script>
  <script src="course.js"></script>
  <script src="fun.js"></script>
  <script src="clock.js"></script>
  <script src="inbox.js"></script>
  <script src="widget.js"></script>
  <script src="tails.js"></script>
</body>
</html>
